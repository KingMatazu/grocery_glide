name: iOS unsigned IPA

on:
  push:
    tags:
      - 'ios-*'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Flutter (stable)
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter pub get
        run: flutter pub get

      - name: Build unsigned Runner.app
        # No --build-name/--build-number override: these used to pin every IPA
        # to 1.0.0 (1), so consecutive builds shared a CFBundleVersion and an
        # over-install would silently not update. Let pubspec drive it.
        run: flutter build ios --release --no-codesign

      - name: Package unsigned IPA (Payload zip)
        run: |
          mkdir -p build/ios/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ios/ipa/Payload/
          cd build/ios/ipa
          zip -r GroceryGlide.ipa Payload/
          ls -lh GroceryGlide.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: grocery-glide-ipa
          path: build/ios/ipa/*.ipa
          if-no-files-found: error
